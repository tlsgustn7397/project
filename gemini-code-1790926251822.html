<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로젝트 소개 & 응원 방명록</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto space-y-8">
    
    <!-- 1. 프로젝트 소개 섹션 -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center space-y-3">
      <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full">Project Showcase</span>
      <h1 class="text-2xl font-bold text-slate-900">구글시트 & Apps Script 기반 방명록 웹사이트</h1>
      <p class="text-sm text-slate-600 leading-relaxed">
        구글 시트를 서버 데이터베이스로 사용하고, Google Apps Script API와 연결하여 
        깃허브 페이지(GitHub Pages)에서 호스팅되는 서버리스 응원 웹페이지입니다.
      </p>
    </header>

    <!-- 2. 응원 메시지 작성 폼 -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <h2 class="text-lg font-semibold text-slate-900 flex items-center gap-2">
        <span>✍️</span> 응원 메시지 남기기
      </h2>
      <form id="commentForm" class="space-y-4">
        <div>
          <label for="nickname" class="block text-xs font-medium text-slate-600 mb-1">별명</label>
          <input 
            type="text" 
            id="nickname" 
            required 
            placeholder="별명을 입력하세요" 
            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          />
        </div>
        <div>
          <label for="message" class="block text-xs font-medium text-slate-600 mb-1">응원 메세지</label>
          <textarea 
            id="message" 
            rows="3" 
            required 
            placeholder="따뜻한 응원의 한 마디를 남겨주세요!" 
            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition resize-none"
          ></textarea>
        </div>
        <button 
          type="submit" 
          id="submitBtn" 
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition duration-200 shadow-sm disabled:bg-slate-300"
        >
          응원메시지 등록하기
        </button>
      </form>
    </section>

    <!-- 3. 응원 메시지 목록 -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-slate-900 flex items-center gap-2">
          <span>💬</span> 응원 목록
        </h2>
        <button id="refreshBtn" class="text-xs text-indigo-600 hover:underline">새로고침</button>
      </div>

      <div id="loading" class="text-center py-8 text-sm text-slate-400">
        메시지를 불러오는 중입니다...
      </div>

      <div id="messageList" class="space-y-3 hidden">
        <!-- JS로 동적 추가됨 -->
      </div>
    </section>

  </div>

  <script>
    // 배포된 Apps Script URL
    const API_URL = "https://script.google.com/macros/s/AKfycbzoj1COKT8dsfisLRDcijOmK5W1jaL3kOmzjviM-TikMDBDd0ijtfW-Juyr_4nxokI/exec";

    const commentForm = document.getElementById('commentForm');
    const nicknameInput = document.getElementById('nickname');
    const messageInput = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const messageList = document.getElementById('messageList');
    const loading = document.getElementById('loading');
    const refreshBtn = document.getElementById('refreshBtn');

    // 1. 메시지 목록 불러오기 (GET)
    async function fetchMessages() {
      loading.classList.remove('hidden');
      messageList.classList.add('hidden');
      
      try {
        const response = await fetch(API_URL);
        const result = await response.json();

        if (result.status === 'success') {
          renderMessages(result.data);
        } else {
          alert('데이터를 가져오는데 실패했습니다: ' + result.message);
        }
      } catch (error) {
        console.error('Error fetching data:', error);
        alert('데이터 통신 중 오류가 발생했습니다.');
      } finally {
        loading.classList.add('hidden');
        messageList.classList.remove('hidden');
      }
    }

    // 2. 메시지 목록 화면에 그리기
    function renderMessages(data) {
      messageList.innerHTML = '';

      if (!data || data.length === 0) {
        messageList.innerHTML = `
          <div class="bg-white p-6 rounded-xl border border-slate-100 text-center text-sm text-slate-400">
            아직 등록된 응원 메시지가 없습니다. 첫 번째 메시지를 남겨보세요!
          </div>
        `;
        return;
      }

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-xl border border-slate-100 shadow-sm space-y-2';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-semibold text-sm text-slate-800">${escapeHtml(item.nickname)}</span>
            <span class="text-xs text-slate-400">${formatDate(item.timestamp)}</span>
          </div>
          <p class="text-sm text-slate-600 whitespace-pre-wrap">${escapeHtml(item.message)}</p>
        `;
        messageList.appendChild(card);
      });
    }

    // 3. 메시지 등록하기 (POST)
    commentForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nickname = nicknameInput.value.trim();
      const message = messageInput.value.trim();

      if (!nickname || !message) return;

      submitBtn.disabled = true;
      submitBtn.innerText = '등록 중...';

      try {
        // Apps Script CORS 호환을 위해 JSON payload 전달
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ nickname, message })
        });

        const result = await response.json();

        if (result.status === 'success') {
          nicknameInput.value = '';
          messageInput.value = '';
          await fetchMessages(); // 목록 새로고침
        } else {
          alert('등록 실패: ' + result.message);
        }
      } catch (error) {
        console.error('Error posting data:', error);
        alert('메시지 등록 중 오류가 발생했습니다.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '응원메시지 등록하기';
      }
    });

    // 새로고침 버튼
    refreshBtn.addEventListener('click', fetchMessages);

    // 날짜 포맷 함수
    function formatDate(dateStr) {
      if (!dateStr) return '';
      return String(dateStr).replace('T', ' ').substring(0, 16);
    }

    // XSS 방지용 문자열 이스케이프
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // 초기 실행
    fetchMessages();
  </script>
</body>
</html>
